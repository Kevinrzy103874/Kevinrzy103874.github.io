<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub图床</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            margin: 0;
        }
        .card {
            max-width: 960px;
            width: 100%;
            background: #161b22;
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
            padding: 36px 32px;
            border: 1px solid #30363d;
            margin-top: 20px;
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .subhead {
            color: #8b949e;
            font-size: 14px;
            border-left: 3px solid #58a6ff;
            padding-left: 14px;
            margin-top: 4px;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .config-section {
            background: #0d1117;
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 24px;
            border: 1px solid #30363d;
        }
        .config-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: center;
        }
        .config-row label {
            color: #f0f6fc;
            font-weight: 500;
            font-size: 14px;
            min-width: 70px;
        }
        .config-row input {
            flex: 1;
            min-width: 160px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 14px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .config-row input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
        }
        .config-row input::placeholder {
            color: #484f58;
        }
        .config-hint {
            color: #8b949e;
            font-size: 12px;
            margin-top: 6px;
            padding-left: 86px;
        }
        .config-hint a {
            color: #58a6ff;
            text-decoration: none;
        }
        .config-hint a:hover { text-decoration: underline; }
        .upload-area {
            border: 2px dashed #30363d;
            border-radius: 18px;
            padding: 44px 20px;
            text-align: center;
            background: #0d1117;
            transition: background 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
            margin-bottom: 20px;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #58a6ff;
            background: #161b22;
        }
        .upload-icon { font-size: 48px; line-height: 1; margin-bottom: 10px; color: #58a6ff; }
        .upload-area p { color: #f0f6fc; font-size: 16px; margin-bottom: 4px; font-weight: 500; }
        .upload-area .hint { color: #8b949e; font-size: 13px; }
        .upload-area input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
            width: 100%; height: 100%;
        }
        .status-bar {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; border-radius: 12px; background: #0d1117;
            border: 1px solid #30363d; margin-bottom: 20px; min-height: 52px;
        }
        .status-icon { font-size: 20px; }
        .status-text { color: #f0f6fc; font-size: 14px; flex: 1; }
        .status-text .highlight { color: #58a6ff; font-weight: 500; }
        .status-text .error { color: #f85149; }
        .progress-bar {
            width: 100%; height: 4px; background: #30363d;
            border-radius: 4px; overflow: hidden; display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #58a6ff, #1f6feb);
            border-radius: 4px; transition: width 0.3s ease;
        }
        .btn {
            background: #21262d; border: 1px solid #30363d; color: #f0f6fc;
            font-weight: 500; font-size: 13px; padding: 6px 18px;
            border-radius: 30px; cursor: pointer; transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { background: #30363d; border-color: #484f58; }
        .btn-primary { background: #238636; border-color: #2ea043; }
        .btn-primary:hover { background: #2ea043; border-color: #3fb950; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #da3633; border-color: #f85149; }
        .btn-danger:hover { background: #f85149; border-color: #ff7b72; }
        .btn-info { background: #1f6feb; border-color: #58a6ff; }
        .btn-info:hover { background: #388bfd; border-color: #79c0ff; }
        .preview-container { margin-top: 4px; display: flex; flex-direction: column; gap: 16px; }
        .image-preview {
            background: #0d1117; border-radius: 16px; padding: 16px;
            text-align: center; border: 1px solid #30363d;
            display: none; flex-direction: column; align-items: center;
        }
        .image-preview.show { display: flex; }
        .image-preview img {
            max-width: 100%; max-height: 360px; border-radius: 12px;
            object-fit: contain; background: #161b22; border: 1px solid #30363d;
        }
        .link-section {
            margin-top: 16px; width: 100%; background: #161b22;
            border-radius: 14px; padding: 14px 16px; border: 1px solid #30363d;
            display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px;
        }
        .link-section .label {
            font-size: 13px; font-weight: 500; color: #8b949e;
            background: #0d1117; padding: 2px 12px; border-radius: 30px;
            border: 1px solid #30363d;
        }
        .link-section .link-input {
            flex: 1; min-width: 180px; border: none; background: transparent;
            padding: 8px 4px; font-size: 13px; color: #f0f6fc;
            outline: none; font-family: monospace; word-break: break-all;
        }
        .markdown-area {
            margin-top: 6px; width: 100%; background: #161b22;
            border-radius: 14px; padding: 12px 16px; border: 1px solid #30363d;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        }
        .markdown-area .label {
            font-size: 13px; font-weight: 500; color: #8b949e;
            background: #0d1117; padding: 2px 12px; border-radius: 30px;
            border: 1px solid #30363d;
        }
        .markdown-code {
            flex: 1; min-width: 160px; background: #0d1117;
            padding: 6px 14px; border-radius: 40px; font-size: 13px;
            font-family: monospace; color: #f0f6fc; border: 1px solid #30363d;
            overflow-x: auto; white-space: nowrap;
        }
        .file-list-section {
            margin-top: 20px;
            background: #0d1117;
            border-radius: 16px;
            padding: 20px 22px;
            border: 1px solid #30363d;
        }
        .file-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-list-header h3 {
            color: #f0f6fc;
            font-size: 16px;
            font-weight: 500;
        }
        .file-list-header .count {
            color: #8b949e;
            font-size: 13px;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .file-grid::-webkit-scrollbar {
            width: 6px;
        }
        .file-grid::-webkit-scrollbar-track {
            background: #0d1117;
        }
        .file-grid::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        .file-item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
        }
        .file-item:hover {
            border-color: #58a6ff;
            background: #1c2128;
        }
        .file-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: #0d1117;
        }
        .file-item .file-name {
            color: #f0f6fc;
            font-size: 11px;
            margin-top: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .file-size {
            color: #8b949e;
            font-size: 10px;
        }
        .file-item .copy-md-btn {
            margin-top: 6px;
            padding: 2px 12px;
            font-size: 11px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #f0f6fc;
            border-radius: 20px;
            cursor: pointer;
        }
        .file-item .copy-md-btn:hover {
            background: #30363d;
        }
        .empty-state {
            color: #8b949e;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
        .footer-note {
            margin-top: 28px; color: #484f58; font-size: 13px;
            border-top: 1px solid #30363d; padding-top: 20px;
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
        }
        .footer-note a { color: #58a6ff; text-decoration: none; }
        .footer-note a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .card { padding: 20px 16px; }
            .config-row { flex-direction: column; align-items: stretch; }
            .config-row label { min-width: auto; }
            .config-hint { padding-left: 0; }
            .link-section, .markdown-area { flex-direction: column; align-items: stretch; }
            .link-input, .markdown-code { min-width: 100%; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📦 GitHub 图床</h1>
        <div class="subhead">
            上传图片 · 查看图床文件 · 一键复制 Markdown 链接 （有使用需求hydro联系）
        </div>

        <!-- 配置区域 - 不预填 Token -->
        <div class="config-section">
            <div class="config-row">
                <label>🔑 Token</label>
                <input type="password" id="tokenInput" placeholder="请输入你的 GitHub Token (github_pat_...)" />
                <button class="btn btn-info" id="testTokenBtn">测试连接</button>
            </div>
            <div class="config-row" style="margin-top: 10px;">
                <label>📁 仓库</label>
                <input type="text" id="repoInput" placeholder="username/repo" />
            </div>
            <div class="config-row" style="margin-top: 10px;">
                <label>📂 路径</label>
                <input type="text" id="pathInput" placeholder="images/" value="images_of_tc/" />
            </div>
            <div class="config-row" style="margin-top: 10px;">
                <label>🌿 分支</label>
                <input type="text" id="branchInput" placeholder="main" value="main" />
            </div>
            <div class="config-hint">
                💡 Token 需要 <strong>repo</strong> 权限 · 
                <a href="https://github.com/settings/tokens" target="_blank">管理 Token</a> · 
                仓库格式: <code>用户名/仓库名</code>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="status-icon">⏳</span>
            <span class="status-text" id="statusText">就绪，请填写配置信息</span>
        </div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 上传区域 -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">☁️</div>
            <p>点击上传 或 拖拽图片</p>
            <div class="hint">支持 JPG / PNG / WebP · 最大 10 MB</div>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <!-- 预览 -->
        <div class="preview-container">
            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="#" alt="预览图片" />
                <div class="link-section">
                    <span class="label">🔗 直链</span>
                    <input class="link-input" id="imageUrlInput" type="text" readonly value="" />
                    <button class="btn btn-primary" id="copyUrlBtn">复制</button>
                </div>
                <div class="markdown-area">
                    <span class="label">📝 Markdown</span>
                    <div class="markdown-code" id="markdownDisplay">![图片]()</div>
                    <button class="btn btn-primary" id="copyMdBtn">复制</button>
                </div>
                <div style="margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-danger" id="clearBtn">🗑️ 清除</button>
                </div>
            </div>
        </div>

        <!-- 文件列表 -->
        <div class="file-list-section">
            <div class="file-list-header">
                <h3>📁 图床文件列表</h3>
                <div>
                    <span class="count" id="fileCount">共 0 个文件</span>
                    <button class="btn btn-info" id="refreshBtn" style="margin-left: 10px;">🔄 刷新</button>
                </div>
            </div>
            <div class="file-grid" id="fileGrid">
                <div class="empty-state">暂无文件，上传一张图片试试</div>
            </div>
        </div>

        <div class="footer-note">
            <span>⚡ 通过 GitHub API 管理 · 数据存储在您的仓库</span>
            <span style="color: #484f58;">v2.0</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // DOM 元素
            const tokenInput = document.getElementById('tokenInput');
            const repoInput = document.getElementById('repoInput');
            const pathInput = document.getElementById('pathInput');
            const branchInput = document.getElementById('branchInput');
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const previewImg = document.getElementById('previewImg');
            const imageUrlInput = document.getElementById('imageUrlInput');
            const markdownDisplay = document.getElementById('markdownDisplay');
            const copyUrlBtn = document.getElementById('copyUrlBtn');
            const copyMdBtn = document.getElementById('copyMdBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const imagePreview = document.getElementById('imagePreview');
            const testTokenBtn = document.getElementById('testTokenBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const fileGrid = document.getElementById('fileGrid');
            const fileCount = document.getElementById('fileCount');

            let currentFile = null;
            let currentDataUrl = null;
            let uploadedUrl = '';
            let allFiles = [];

            // ---------- 工具函数 ----------
            function setStatus(icon, text, isError = false) {
                document.querySelector('.status-icon').textContent = icon;
                statusText.innerHTML = text;
                statusText.style.color = isError ? '#f85149' : '#f0f6fc';
            }

            function updateProgress(percent) {
                progressBar.classList.add('active');
                progressFill.style.width = percent + '%';
                if (percent >= 100) {
                    setTimeout(() => {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 1200);
                }
            }

            function getConfig() {
                const token = tokenInput.value.trim();
                const repo = repoInput.value.trim();
                const path = pathInput.value.trim();
                const branch = branchInput.value.trim() || 'main';
                if (!token) { setStatus('⚠️', '请填写 GitHub Token', true); return null; }
                if (!repo) { setStatus('⚠️', '请填写仓库 (格式: username/repo)', true); return null; }
                if (!repo.includes('/')) { setStatus('⚠️', '仓库格式错误，应为 username/repo', true); return null; }
                return { token, repo, path: path || 'images/', branch };
            }

            function generateFileName(originalName) {
                const ext = originalName.includes('.') ? originalName.split('.').pop() : 'png';
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 8);
                return `${timestamp}-${random}.${ext}`;
            }

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            // ---------- 测试 Token ----------
            async function testToken() {
                const token = tokenInput.value.trim();
                if (!token) {
                    setStatus('⚠️', '请先填写 Token', true);
                    return;
                }
                setStatus('⏳', '正在测试 Token...');
                try {
                    const response = await fetch('https://api.github.com/user', {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        setStatus('✅', `Token 有效！已认证用户: <span class="highlight">${data.login}</span>`);
                    } else if (response.status === 401) {
                        setStatus('❌', 'Token 无效或已过期，请检查', true);
                    } else {
                        setStatus('❌', `Token 验证失败 (HTTP ${response.status})`, true);
                    }
                } catch (error) {
                    setStatus('❌', `网络错误: ${error.message}`, true);
                }
            }

            testTokenBtn.addEventListener('click', testToken);

            // ---------- 获取文件列表 ----------
            async function fetchFileList() {
                const config = getConfig();
                if (!config) return;

                setStatus('⏳', '正在加载文件列表...');
                try {
                    const path = config.path.endsWith('/') ? config.path : config.path + '/';
                    const url = `https://api.github.com/repos/${config.repo}/contents/${path}?ref=${config.branch}`;
                    
                    const response = await fetch(url, {
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (!response.ok) {
                        if (response.status === 404) {
                            setStatus('📁', '路径不存在，请检查路径是否正确', false);
                            fileGrid.innerHTML = '<div class="empty-state">路径不存在，上传图片后会自动创建</div>';
                            fileCount.textContent = '共 0 个文件';
                            return;
                        }
                        const error = await response.json();
                        throw new Error(error.message || '获取列表失败');
                    }

                    const data = await response.json();
                    // 过滤出图片文件
                    const imageFiles = data.filter(item => 
                        item.type === 'file' && 
                        /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i.test(item.name)
                    );

                    allFiles = imageFiles;
                    fileCount.textContent = `共 ${imageFiles.length} 个文件`;
                    renderFileList(imageFiles, config);
                    setStatus('✅', `加载成功！找到 <span class="highlight">${imageFiles.length}</span> 个图片文件`);
                } catch (error) {
                    setStatus('❌', `加载失败: ${error.message}`, true);
                    fileGrid.innerHTML = `<div class="empty-state">加载失败: ${error.message}</div>`;
                }
            }

            // ---------- 渲染文件列表 ----------
            function renderFileList(files, config) {
                if (!files || files.length === 0) {
                    fileGrid.innerHTML = '<div class="empty-state">暂无图片文件</div>';
                    return;
                }

                const baseUrl = `https://raw.githubusercontent.com/${config.repo}/${config.branch}/`;
                const path = config.path.endsWith('/') ? config.path : config.path + '/';

                fileGrid.innerHTML = files.map(file => {
                    const rawUrl = `${baseUrl}${path}${file.name}`;
                    const markdown = `![${file.name}](${rawUrl})`;
                    const size = formatFileSize(file.size);
                    
                    return `
                        <div class="file-item" data-url="${rawUrl}" data-markdown="${markdown}">
                            <img src="${rawUrl}" alt="${file.name}" loading="lazy" 
                                 onerror="this.style.display='none'" />
                            <div class="file-name" title="${file.name}">${file.name}</div>
                            <div class="file-size">${size}</div>
                            <button class="copy-md-btn" onclick="copyMarkdown('${markdown.replace(/'/g, "\\'")}')">📋 复制 MD</button>
                        </div>
                    `;
                }).join('');

                // 点击图片复制 URL
                document.querySelectorAll('.file-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        if (e.target.tagName === 'BUTTON') return;
                        const url = this.dataset.url;
                        navigator.clipboard.writeText(url).then(() => {
                            setStatus('✅', '已复制图片链接到剪贴板');
                        }).catch(() => {
                            // 降级方案
                            const input = document.createElement('input');
                            input.value = url;
                            document.body.appendChild(input);
                            input.select();
                            document.execCommand('copy');
                            document.body.removeChild(input);
                            setStatus('✅', '已复制图片链接到剪贴板');
                        });
                    });
                });
            }

            // 全局函数供 onclick 调用
            window.copyMarkdown = function(markdown) {
                navigator.clipboard.writeText(markdown).then(() => {
                    setStatus('✅', '已复制 Markdown 到剪贴板');
                }).catch(() => {
                    const input = document.createElement('input');
                    input.value = markdown;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    setStatus('✅', '已复制 Markdown 到剪贴板');
                });
            };

            refreshBtn.addEventListener('click', fetchFileList);

            // ---------- 上传到 GitHub ----------
            async function uploadToGitHub(file, config) {
                const { token, repo, path, branch } = config;
                const fileName = generateFileName(file.name);
                const filePath = path.endsWith('/') ? path + fileName : path + '/' + fileName;

                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const dataUrl = reader.result;
                        const base64Data = dataUrl.split(',')[1];
                        resolve(base64Data);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                const apiUrl = `https://api.github.com/repos/${repo}/contents/${filePath}`;
                const payload = {
                    message: `Upload ${fileName} via GitHub图床`,
                    content: base64,
                    branch: branch
                };

                setStatus('⏳', `正在上传 <span class="highlight">${fileName}</span> ...`);
                updateProgress(30);

                const response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(payload)
                });

                updateProgress(80);

                if (!response.ok) {
                    const errorData = await response.json();
                    let errorMsg = errorData.message || '上传失败';
                    if (response.status === 401) errorMsg = 'Token 无效或权限不足 (需要 repo 权限)';
                    else if (response.status === 404) errorMsg = '仓库不存在或路径错误';
                    else if (response.status === 422) errorMsg = '文件已存在或路径格式错误';
                    else if (response.status === 403) errorMsg = 'Token 权限不足，请检查是否勾选了 repo 权限';
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                const rawUrl = result.content?.download_url || 
                              `https://raw.githubusercontent.com/${repo}/${branch}/${filePath}`;
                
                updateProgress(100);
                return { rawUrl, fileName, filePath };
            }

            // ---------- 显示图片 ----------
            function showImage(dataUrl, rawUrl, fileName) {
                currentDataUrl = dataUrl;
                uploadedUrl = rawUrl;
                previewImg.src = dataUrl;
                imagePreview.classList.add('show');
                imageUrlInput.value = rawUrl;
                markdownDisplay.innerHTML = `![${fileName || '图片'}](${rawUrl})`;
                setStatus('✅', `上传成功！<span class="highlight">${fileName}</span> 已保存到仓库`);
                // 自动刷新列表
                setTimeout(fetchFileList, 1000);
            }

            // ---------- 重置 UI ----------
            function resetUI() {
                imagePreview.classList.remove('show');
                previewImg.src = '#';
                imageUrlInput.value = '';
                markdownDisplay.innerHTML = '![图片]()';
                currentFile = null;
                currentDataUrl = null;
                uploadedUrl = '';
                fileInput.value = '';
                setStatus('⏳', '就绪');
            }

            // ---------- 处理文件上传 ----------
            async function handleFileUpload(file) {
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    setStatus('⚠️', '请上传图片文件 (JPG, PNG, WebP 等)', true);
                    return;
                }
                if (file.size > 10 * 1024 * 1024) {
                    setStatus('⚠️', `文件过大 (${(file.size/1024/1024).toFixed(1)} MB)，请上传小于 10 MB 的图片`, true);
                    return;
                }

                const config = getConfig();
                if (!config) return;

                currentFile = file;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const dataUrl = e.target.result;
                    currentDataUrl = dataUrl;
                    previewImg.src = dataUrl;
                    imagePreview.classList.add('show');
                    imageUrlInput.value = '上传中...';
                    markdownDisplay.innerHTML = '⏳ 上传中...';

                    try {
                        const result = await uploadToGitHub(file, config);
                        showImage(dataUrl, result.rawUrl, result.fileName);
                    } catch (error) {
                        setStatus('❌', `上传失败: ${error.message}`, true);
                        imageUrlInput.value = '上传失败，请重试';
                        markdownDisplay.innerHTML = '![上传失败]()';
                        console.error('Upload error:', error);
                    }
                };
                reader.readAsDataURL(file);
            }

            // ---------- 事件绑定 ----------
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    handleFileUpload(this.files[0]);
                }
                this.value = '';
            });

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    handleFileUpload(files[0]);
                }
            });

            copyUrlBtn.addEventListener('click', async () => {
                const url = imageUrlInput.value;
                if (!url || url === '上传中...' || url === '上传失败，请重试') {
                    setStatus('⚠️', '没有有效的链接可复制', true);
                    return;
                }
                try {
                    await navigator.clipboard.writeText(url);
                    copyUrlBtn.textContent = '✅ 已复制';
                    setTimeout(() => copyUrlBtn.textContent = '复制', 2000);
                } catch {
                    imageUrlInput.select();
                    document.execCommand('copy');
                    copyUrlBtn.textContent = '✅ 已复制';
                    setTimeout(() => copyUrlBtn.textContent = '复制', 2000);
                }
            });

            copyMdBtn.addEventListener('click', async () => {
                const mdText = markdownDisplay.textContent || markdownDisplay.innerText;
                if (!mdText || mdText.includes('上传中') || mdText === '![图片]()') {
                    setStatus('⚠️', '没有有效的 Markdown 可复制', true);
                    return;
                }
                try {
                    await navigator.clipboard.writeText(mdText);
                    copyMdBtn.textContent = '✅ 已复制';
                    setTimeout(() => copyMdBtn.textContent = '复制', 2000);
                } catch {
                    const range = document.createRange();
                    range.selectNodeContents(markdownDisplay);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                    document.execCommand('copy');
                    copyMdBtn.textContent = '✅ 已复制';
                    setTimeout(() => copyMdBtn.textContent = '复制', 2000);
                }
            });

            clearBtn.addEventListener('click', resetUI);
            imageUrlInput.addEventListener('click', function() { this.select(); });

            // 保存配置到 localStorage
            [repoInput, pathInput, branchInput].forEach(el => {
                el.addEventListener('change', () => {
                    try {
                        localStorage.setItem('github_imgbed_config', JSON.stringify({
                            repo: repoInput.value.trim(),
                            path: pathInput.value.trim(),
                            branch: branchInput.value.trim()
                        }));
                    } catch(e) {}
                });
            });

            // 从 localStorage 恢复配置
            try {
                const saved = localStorage.getItem('github_imgbed_config');
                if (saved) {
                    const config = JSON.parse(saved);
                    if (config.repo) repoInput.value = config.repo;
                    if (config.path) pathInput.value = config.path;
                    if (config.branch) branchInput.value = config.branch;
                }
            } catch(e) {}

            resetUI();
            console.log('📦 GitHub 图床管理已加载');
            console.log('💡 请填写 Token、仓库信息，然后点击"测试连接"验证');
        })();
    </script>
</body>
</html>
