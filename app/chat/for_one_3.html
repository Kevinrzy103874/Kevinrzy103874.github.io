<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>一个小网页3.0</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .chat-app {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: #f8fafc;
            border-radius: 32px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
        }
        /* 主聊天区域 */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: rgba(255,255,255,0.96);
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .my-id-card {
            background: #eef2ff;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .connection-panel { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .connection-panel input {
            padding: 8px 14px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            width: 200px;
            outline: none;
        }
        button {
            background: #3b82f6;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { background: #2563eb; transform: translateY(-1px); }
        .status-badge {
            background: #e2e8f0;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.75rem;
        }
        .status-badge.online { background: #dcfce7; color: #15803d; }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f1f5f9;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: fadeInUp 0.2s ease;
        }
        .message.own { align-self: flex-end; }
        .message.other { align-self: flex-start; }
        .bubble {
            padding: 10px 16px;
            border-radius: 24px;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .message.own .bubble { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .message.other .bubble { background: #ffffff; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
        /* 完整 Markdown 样式 */
        .bubble pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }
        .bubble code {
            background: rgba(0,0,0,0.08);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: monospace;
        }
        .message.own .bubble code { background: rgba(255,255,255,0.2); color: white; }
        .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 0.5em 0; }
        .bubble p { margin: 0.3em 0; }
        .bubble a { color: #3b82f6; text-decoration: none; }
        .message.own .bubble a { color: #facc15; }
        .bubble img { max-width: 100%; border-radius: 12px; margin: 4px 0; }
        .bubble ul, .bubble ol { padding-left: 1.5em; margin: 0.5em 0; }
        .bubble blockquote {
            border-left: 4px solid #3b82f6;
            margin: 0.5em 0;
            padding-left: 1em;
            color: #475569;
        }
        .meta {
            font-size: 0.7rem;
            margin: 4px 10px 0;
            display: flex;
            gap: 12px;
            color: #64748b;
        }
        .message.own .meta { justify-content: flex-end; }
        .file-preview { margin-top: 8px; border-radius: 16px; max-width: 260px; cursor: pointer; }
        .file-preview img { max-width: 100%; max-height: 180px; border-radius: 12px; }
        .file-attachment {
            background: rgba(0,0,0,0.05);
            border-radius: 20px;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .input-area {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 14px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-wrapper {
            flex: 1;
            display: flex;
            background: #f1f5f9;
            border-radius: 60px;
            padding: 4px 8px 4px 18px;
            align-items: center;
        }
        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            outline: none;
        }
        .file-buttons label {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 10px 14px;
            cursor: pointer;
        }
        /* 右侧历史文件侧边栏 */
        .history-sidebar {
            width: 280px;
            background: white;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .history-header {
            padding: 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-history {
            background: none;
            color: #ef4444;
            font-size: 12px;
            padding: 4px 8px;
            box-shadow: none;
        }
        .history-list {
            flex: 1;
            padding: 12px;
        }
        .history-item {
            padding: 10px;
            border-radius: 12px;
            background: #f1f5f9;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.1s;
        }
        .history-item:hover { background: #e2e8f0; }
        .progress-overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            z-index: 1000;
            display: flex;
            gap: 12px;
        }
        .progress-bar-bg { width: 150px; height: 6px; background: #334155; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #3b82f6; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>
<div class="chat-app">
    <div class="main-area">
        <div class="chat-header">
            <div class="my-id-card"><i class="fas fa-id-card"></i><span id="myPeerId">初始化...</span><button id="copyIdBtn" style="background:#e2e8f0; color:#1e293b; padding:4px 10px;">复制</button></div>
            <div class="status-badge" id="connectionStatus"><i class="fas fa-plug"></i> 未连接</div>
            <div class="connection-panel">
                <input type="text" id="remotePeerIdInput" placeholder="对方 Peer ID">
                <button id="connectBtn"><i class="fas fa-link"></i> 连接</button>
                <button id="disconnectBtn" style="background:#64748b;"><i class="fas fa-unlink"></i> 断开</button>
            </div>
        </div>
        <div class="messages-area" id="messagesContainer">
            <div class="message other"><div class="bubble">✨ <strong>专业单聊室</strong><br>✅ 完整 Markdown 支持 (标题、代码块、列表、引用、表格等)<br>✅ 大文件分块传输 (100MB+)<br>✅ 桌面通知 & 历史文件记录<br>💡 复制你的ID发给好友，输入对方ID连接即可。</div></div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="支持完整Markdown：```代码块``` **粗体** > 引用 等">
                <button id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
            <div class="file-buttons">
                <label for="imageUpload"><i class="fas fa-image"></i></label>
                <input type="file" id="imageUpload" accept="image/*" style="display:none">
                <label for="fileUpload"><i class="fas fa-paperclip"></i></label>
                <input type="file" id="fileUpload" style="display:none">
            </div>
        </div>
    </div>
    <div class="history-sidebar">
        <div class="history-header"><i class="fas fa-history"></i> 历史文件 <button id="clearHistoryBtn" class="clear-history"><i class="fas fa-trash"></i></button></div>
        <div class="history-list" id="historyList"><div style="color:gray; text-align:center; padding:20px;">暂无文件记录</div></div>
    </div>
</div>

<script>
    const CHUNK_SIZE = 1024 * 1024;
    let peer = null, currentConnection = null, myId = null;
    let receiveBufferMap = new Map();
    let fileHistory = []; // { name, url, type, timestamp, isReceive }

    function saveToHistory(name, url, type, isReceive) {
        fileHistory.unshift({ name, url, type, timestamp: new Date(), isReceive });
        if (fileHistory.length > 100) fileHistory.pop();
        renderHistory();
    }
    function renderHistory() {
        const container = document.getElementById('historyList');
        if (!fileHistory.length) { container.innerHTML = '<div style="color:gray; text-align:center; padding:20px;">暂无文件记录</div>'; return; }
        container.innerHTML = fileHistory.map(f => `
            <div class="history-item" onclick="window.open('${f.url}', '_blank')">
                <i class="fas ${f.type === 'image' ? 'fa-image' : 'fa-file'}"></i>
                <strong>${f.name.substring(0, 22)}</strong><br>
                <small>${f.timestamp.toLocaleTimeString()} ${f.isReceive ? '📥' : '📤'}</small>
            </div>
        `).join('');
    }
    document.getElementById('clearHistoryBtn')?.addEventListener('click', () => {
        fileHistory = [];
        renderHistory();
    });

    let notifyGranted = false;
    if ("Notification" in window) Notification.requestPermission().then(p => notifyGranted = p === "granted");
    function notify(title, body) { if(notifyGranted) new Notification(title, { body }); }

    // 完整 Markdown 渲染 (支持表格、任务列表等)
    marked.setOptions({ breaks: true, gfm: true });
    function renderMarkdown(text) {
        if (!text) return '';
        try {
            let html = marked.parse(text);
            return DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
        } catch(e) { return text.replace(/</g, '&lt;'); }
    }

    function addMessage(text, isOwn, extra = null) {
        const container = document.getElementById('messagesContainer');
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : 'other'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (extra && extra.type === 'image') {
            const imgDiv = document.createElement('div');
            imgDiv.className = 'file-preview';
            const img = document.createElement('img');
            img.src = extra.url;
            img.onclick = () => window.open(extra.url);
            imgDiv.appendChild(img);
            bubble.appendChild(imgDiv);
            if (text) bubble.appendChild(document.createTextNode(text));
            saveToHistory(extra.name || '图片', extra.url, 'image', !isOwn);
        } else if (extra && extra.type === 'file') {
            const fileDiv = document.createElement('div');
            fileDiv.className = 'file-attachment';
            const link = document.createElement('a');
            link.href = extra.url;
            link.download = extra.name;
            link.textContent = `📎 ${extra.name}`;
            link.target = '_blank';
            fileDiv.appendChild(link);
            bubble.appendChild(fileDiv);
            if (text) bubble.appendChild(document.createTextNode(text));
            saveToHistory(extra.name, extra.url, 'file', !isOwn);
        } else {
            bubble.innerHTML = renderMarkdown(text);
        }
        div.appendChild(bubble);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<span>${isOwn ? '我' : '对方'}</span><span>${new Date().toLocaleTimeString()}</span>`;
        div.appendChild(meta);
        container.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
        if (!isOwn && document.hidden) notify('新消息', text?.substring(0,50) || '文件');
    }
    function addSystemMessage(msg) { addMessage(msg, false, null); }

    // 大文件发送 (分块)
    function sendLargeFile(file, isImage) {
        if (!currentConnection?.open) { addSystemMessage('未连接对方'); return; }
        const fileId = Date.now() + '_' + Math.random().toString(36).substr(2);
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        let idx = 0;
        function sendNext() {
            if (idx >= totalChunks) {
                currentConnection.send({ type: 'file_end', fileId, fileName: file.name, fileSize: file.size, mime: file.type, isImage });
                return;
            }
            const start = idx * CHUNK_SIZE;
            const end = Math.min(start + CHUNK_SIZE, file.size);
            const reader = new FileReader();
            reader.onload = (e) => {
                currentConnection.send({ type: 'file_chunk', fileId, chunkIndex: idx, totalChunks, data: e.target.result });
                idx++;
                sendNext();
            };
            reader.readAsArrayBuffer(file.slice(start, end));
        }
        currentConnection.send({ type: 'file_start', fileId, fileName: file.name, totalChunks, fileSize: file.size, mime: file.type, isImage });
        sendNext();
        const url = URL.createObjectURL(file);
        addMessage(isImage ? `📷 图片: ${file.name}` : `📁 文件: ${file.name}`, true, { type: isImage ? 'image' : 'file', url, name: file.name });
    }

    function sendTextMessage(text) {
        if (!text.trim()) return;
        if (!currentConnection?.open) { addSystemMessage('未建立连接'); return; }
        currentConnection.send({ type: 'text', content: text.trim() });
        addMessage(text.trim(), true);
        document.getElementById('messageInput').value = '';
    }

    function handleReceiveData(data) {
        if (data.type === 'text') addMessage(data.content, false);
        else if (data.type === 'file_start') {
            receiveBufferMap.set(data.fileId, { chunks: new Array(data.totalChunks), totalChunks: data.totalChunks, fileName: data.fileName, mime: data.mime, isImage: data.isImage, received: 0 });
        } else if (data.type === 'file_chunk') {
            const entry = receiveBufferMap.get(data.fileId);
            if (entry) {
                if (!entry.chunks[data.chunkIndex]) { entry.chunks[data.chunkIndex] = data.data; entry.received++; }
                if (entry.received === entry.totalChunks) {
                    const blob = new Blob(entry.chunks, { type: entry.mime });
                    const url = URL.createObjectURL(blob);
                    addMessage(entry.isImage ? `📷 图片: ${entry.fileName}` : `📎 文件: ${entry.fileName}`, false, { type: entry.isImage ? 'image' : 'file', url, name: entry.fileName });
                    receiveBufferMap.delete(data.fileId);
                }
            }
        } else if (data.type === 'file_end') { /* 完成 */ }
    }

    function setupConnection(conn, remoteId) {
        conn.on('open', () => {
            currentConnection = conn;
            updateConnectionStatus(true, remoteId);
            conn.on('data', handleReceiveData);
            conn.on('close', () => { if(currentConnection === conn) { currentConnection = null; updateConnectionStatus(false); addSystemMessage('连接已断开'); } });
            conn.on('error', (e) => addSystemMessage(`连接错误: ${e.message}`));
            addSystemMessage(`✅ 与 ${remoteId} 连接成功`);
        });
        conn.on('error', (e) => addSystemMessage(`连接失败: ${e.message}`));
    }

    function connectToPeer(remoteId) {
        if (!remoteId || remoteId === myId) { addSystemMessage('无效ID或不能连接自己'); return; }
        if (currentConnection?.open) { addSystemMessage('已有连接，请先断开'); return; }
        const conn = peer.connect(remoteId, { reliable: true });
        setupConnection(conn, remoteId);
    }
    function disconnectCurrent() { if(currentConnection) { currentConnection.close(); currentConnection = null; updateConnectionStatus(false); addSystemMessage('已断开连接'); } }

    function updateConnectionStatus(connected, remoteId = null) {
        const statusSpan = document.getElementById('connectionStatus');
        if (connected && remoteId) {
            statusSpan.innerHTML = `<i class="fas fa-circle" style="color:#22c55e;"></i> 已连接: ${remoteId.substring(0,8)}...`;
            statusSpan.classList.add('online');
            document.getElementById('disconnectBtn').disabled = false;
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('remotePeerIdInput').disabled = true;
        } else {
            statusSpan.innerHTML = `<i class="fas fa-plug"></i> 未连接`;
            statusSpan.classList.remove('online');
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('remotePeerIdInput').disabled = false;
        }
    }

    // 初始化 Peer
    peer = new Peer(undefined, { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
    peer.on('open', (id) => { myId = id; document.getElementById('myPeerId').innerText = id; addSystemMessage(`你的ID: ${id}`); });
    peer.on('connection', (conn) => {
        if (currentConnection && currentConnection.open) { conn.close(); addSystemMessage(`拒绝 ${conn.peer} 连接，已有连接`); return; }
        addSystemMessage(`收到 ${conn.peer} 的连接请求`);
        setupConnection(conn, conn.peer);
        if (conn.open && !currentConnection) { currentConnection = conn; updateConnectionStatus(true, conn.peer); conn.on('data', handleReceiveData); }
        else conn.on('open', () => { if(!currentConnection) { currentConnection = conn; updateConnectionStatus(true, conn.peer); conn.on('data', handleReceiveData); } });
    });
    peer.on('error', (err) => addSystemMessage(`Peer错误: ${err.message}`));

    // UI 绑定
    document.getElementById('connectBtn').onclick = () => connectToPeer(document.getElementById('remotePeerIdInput').value.trim());
    document.getElementById('disconnectBtn').onclick = disconnectCurrent;
    document.getElementById('sendMsgBtn').onclick = () => sendTextMessage(document.getElementById('messageInput').value);
    document.getElementById('messageInput').onkeypress = (e) => { if(e.key === 'Enter') sendTextMessage(e.target.value); };
    document.getElementById('copyIdBtn').onclick = () => { if(myId) { navigator.clipboard.writeText(myId); addSystemMessage('✅ 已复制ID'); } };
    document.getElementById('imageUpload').onchange = (e) => { if(e.target.files[0]) sendLargeFile(e.target.files[0], true); e.target.value = ''; };
    document.getElementById('fileUpload').onchange = (e) => { if(e.target.files[0]) sendLargeFile(e.target.files[0], false); e.target.value = ''; };
    window.onload = () => document.getElementById('messageInput').focus();
</script>
</body>
</html>
